<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0A0B10">
<title>Caja · 4712web</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caja">
<style>
:root{--a:#3D5AFE;--ink:#0A0B10;--mut:#5B6170;--line:#E4E7EE;--bg:#F4F5F8;--ok:#12A150;--warn:#E8590C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
header b{font-size:20px;letter-spacing:-.02em}
header small{color:var(--mut);font-size:13px}
main{max-width:640px;margin:0 auto;padding:14px 16px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;padding:10px 0 12px;font:600 12px system-ui;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prod{border:0;background:#fff;border-radius:16px;padding:14px 8px;min-height:86px;font:600 14px system-ui;color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;text-align:center;box-shadow:0 1px 0 var(--line)}
.prod:active{transform:scale(.96);background:#EEF1FF}
.prod em{font-style:normal;font-weight:800;color:var(--a);font-size:15px}
.prod.libre{background:var(--ink);color:#fff}.prod.libre em{color:#fff}
.search{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);font-size:16px;margin-bottom:12px;background:#fff}
.ticket{position:fixed;left:0;right:0;bottom:66px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(20,30,80,.08);z-index:4;max-width:640px;margin:0 auto;border-radius:20px 20px 0 0}
.ticket .items{max-height:28vh;overflow:auto;padding:6px 16px}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.it .n{flex:1}.it .q{display:flex;align-items:center;gap:8px}
.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;line-height:1}
.tot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.tot b{font-size:28px;letter-spacing:-.02em}
.btn{border:0;border-radius:14px;padding:15px;font:700 16px system-ui;background:var(--a);color:#fff;width:100%}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}
.row{display:flex;gap:10px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em}
.lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--a);margin-bottom:6px}
.mut{color:var(--mut);font-size:14px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.kv:last-child{border:0}
.list .li{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border:0}
.debe{color:var(--warn);font-weight:800}
.modal{position:fixed;inset:0;background:rgba(10,11,16,.45);display:none;align-items:flex-end;z-index:20}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:20px}
input.f{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);font-size:18px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 12px;font:600 14px system-ui}
.vuelto{background:#EAF7EF;color:var(--ok);border-radius:14px;padding:14px;font-weight:800;font-size:22px;text-align:center;margin-bottom:12px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;z-index:30;pointer-events:none}
.toast.show{opacity:1}
.hide{display:none!important}
</style>
</head>
<body>
<header style="background:#0A0B10;color:#fff;border:0"><div style="display:flex;align-items:center;gap:10px"><img src="icon-192.png" style="width:40px;height:40px;border-radius:50%"><div><b id="nomN">Mi negocio</b><br><small id="hoy" style="color:#aaa"></small></div></div><button id="inst" class="hide" onclick="instalar()" style="border:0;background:var(--a);color:#fff;border-radius:999px;padding:9px 14px;font:700 14px system-ui">📲 Instalar</button><small id="brand" style="color:#888">4712web</small></header>
<main id="main"></main>

<div class="ticket hide" id="ticket">
  <div class="items" id="items"></div>
  <div class="tot"><div><div class="mut">Total</div><b id="total">$0</b></div><div class="row" style="width:58%"><button class="btn sec" style="width:40%" onclick="limpiar()">✕</button><button class="btn" onclick="cobrar()">Cobrar</button></div></div>
</div>

<nav>
  <button data-v="vender" class="on"><span>🛒</span>Vender</button>
  <button data-v="fiado"><span>📒</span>Fiado</button>
  <button data-v="caja"><span>💵</span>Caja</button>
  <button data-v="prods"><span>🏷️</span>Productos</button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this&&!window._bloq)cerrar()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const fmt=n=>'$'+Math.round(n).toLocaleString('es-AR');
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const hoyKey=()=>dk(Date.now());
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY='caja4712';
const SEED={prods:[],barberos:[],com:[],ventas:[],clientes:[]};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.prods)S=JSON.parse(JSON.stringify(SEED));if(!S.barberos)S.barberos=[];if(!S.com)S.com=[];if(!S.ultResp)S.ultResp=Date.now();if(!S.gastos)S.gastos=[];if(!S.aperturas)S.aperturas={};let barb=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let cart=[],view='vender',q='',per='hoy';

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
function abrir(h){$('#sheet').innerHTML=h;$('#modal').classList.add('show')}
function cerrar(){$('#modal').classList.remove('show')}
const deuda=c=>c.movs.reduce((s,m)=>s+(m.tipo==='deuda'?m.m:-m.m),0);
const totalCart=()=>cart.reduce((s,i)=>s+i.p*i.q,0);

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
$('#hoy').textContent=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});

function render(){
  const m=$('#main');
  $('#ticket').classList.toggle('hide',!(view==='vender'&&cart.length));
  document.body.style.paddingBottom=(view==='vender'&&cart.length)?'calc(84px + 34vh)':'84px';
  if(view==='vender'){const gb=estadoLic()==='gracia'?`<div class="card" style="background:#FFF4E5" onclick="pedirCodigo()"><b>⚠️ Tu mes venció</b><div class="mut">Tenés hasta el 10 para renovar. Tocá para poner el código.</div></div>`:'';
    const ps=S.prods.filter(p=>p.n.toLowerCase().includes(q.toLowerCase()));
    m.innerHTML=gb+`<input class="search" placeholder="Buscar…" value="${q}" oninput="q=this.value;renderGrid()"><div class="grid" id="grid"></div>`;
    renderGrid();
  }
  if(view==='fiado'){
    const cs=[...S.clientes].sort((a,b)=>deuda(b)-deuda(a));
    const tot=cs.reduce((s,c)=>s+Math.max(0,deuda(c)),0);
    m.innerHTML=`<div class="card"><div class="lbl">Te deben en total</div><div class="big debe">${fmt(tot)}</div></div>
    <div class="card list">${cs.length?cs.map(c=>`<div class="li" onclick="verCliente('${c.id}')"><div><b>${c.n}</b><div class="mut">${c.movs.length} movimientos</div></div><div class="${deuda(c)>0?'debe':''}">${fmt(deuda(c))}</div></div>`).join(''):'<div class="empty">Nadie te debe 🙌</div>'}</div>
    <button class="btn sec" onclick="nuevoCliente()">+ Agregar cliente</button>`;
  }
  if(view==='caja'){
    const now=new Date(),d=hoyKey();
    const [ini,fin]=rango(per);
    const vs=S.ventas.filter(v=>v.t>=ini&&v.t<fin);
    const sum=md=>vs.filter(v=>v.medio===md).reduce((s,v)=>s+v.total,0);
    const ef=sum('ef'),tr=sum('tr'),fi=sum('fi');
    let cob={ef:0,tr:0};S.clientes.forEach(c=>c.movs.forEach(mv=>{if(mv.tipo==='pago'&&mv.t>=ini&&mv.t<fin)cob[mv.medio||'ef']+=mv.m}));
    const tit=rango(per)[2];
    const top={};vs.forEach(v=>v.items.forEach(i=>{top[i.n]=top[i.n]||{q:0,m:0};top[i.n].q+=i.q;top[i.n].m+=i.p*i.q}));
    const tops=Object.entries(top).sort((a,b)=>b[1].m-a[1].m).slice(0,5);
    const dias={};if(per!=='hoy')vs.forEach(v=>{const k=dk(v.t);dias[k]=(dias[k]||0)+v.total});
    const dmax=Math.max(1,...Object.values(dias));
    const gs=S.gastos.filter(g=>g.t>=ini&&g.t<fin),gsum=md=>gs.filter(g=>!md||g.medio===md).reduce((s,g)=>s+g.m,0),gef=gsum('ef'),gtr=gsum('tr');
    const ap=per==='hoy'?(S.aperturas[d]||0):0,enCaja=ap+ef+cob.ef-gef;
    const ingresos=ef+tr+cob.ef+cob.tr,neto=ingresos-gef-gtr;
    const ticket=vs.length?(ef+tr+fi)/vs.length:0;
    const fin2=Math.min(fin,Date.now()),pIni=ini-(fin2-ini),pv=S.ventas.filter(v=>v.t>=pIni&&v.t<ini).reduce((s,v)=>s+v.total,0),tot=ef+tr+fi,dif=pv?Math.round((tot-pv)/pv*100):null;
    const hs={};vs.forEach(v=>{const h=new Date(v.t).getHours();hs[h]=(hs[h]||0)+1});const hp=Object.entries(hs).sort((a,b)=>b[1]-a[1])[0];
    const md=Object.entries(dias).sort((a,b)=>b[1]-a[1])[0];
    const prevTxt={hoy:'ayer a esta hora',sem:'la semana anterior',ant:'la semana anterior',mes:'el mes pasado'}[per];
    const sinResp=!S.ultResp||Date.now()-S.ultResp>7*864e5;
    m.innerHTML=`${sinResp?`<div class="card" style="background:#FFF4E5" onclick="respaldar()"><b>⚠️ Hace más de 7 días que no guardás una copia</b><div class="mut">Tocá acá para guardarla en tu WhatsApp</div></div>`:''}
    <div class="chips" style="display:grid;grid-template-columns:repeat(4,1fr)">${['hoy','sem','ant','mes'].map(k=>`<button style="${per===k?'background:var(--a);color:#fff;border-color:var(--a)':''}" onclick="per='${k}';render()">${{hoy:'Hoy',sem:'Semana',ant:'Sem. pasada',mes:'Mes'}[k]}</button>`).join('')}</div>
    <div class="card"><div class="lbl">${tit}</div><div class="big">${fmt(ef+tr+fi)}</div><div class="mut">${vs.length} ${vs.length===1?'venta':'ventas'}</div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px"><div class="card" style="margin:0;background:#EAF7EF"><div class="lbl" style="color:var(--ok)">💵 Efectivo</div><div style="font-size:24px;font-weight:800">${fmt(ef+cob.ef)}</div></div><div class="card" style="margin:0;background:#E8F3FF"><div class="lbl" style="color:#0a66c2">📲 Mercado Pago</div><div style="font-size:24px;font-weight:800">${fmt(tr+cob.tr)}</div></div></div>
    <div class="card"><div class="lbl">Resumen de plata</div>
      <div class="kv"><span>💵 Ventas en efectivo</span><b>${fmt(ef)}</b></div>
      <div class="kv"><span>📲 Ventas por Mercado Pago</span><b>${fmt(tr)}</b></div>
      <div class="kv"><span>📒 Fiado (todavía no cobrado)</span><b class="debe">${fmt(fi)}</b></div>
      <div class="kv"><span>↩️ Cobros de fiado</span><b>${fmt(cob.ef+cob.tr)}</b></div>
      <div class="kv"><span>💸 Gastos y retiros</span><b style="color:#c00">−${fmt(gef+gtr)}</b></div>
      <div class="kv" style="border-top:2px solid var(--ink);margin-top:4px"><span><b>💰 Te quedó (neto)</b></span><b style="font-size:20px;color:${neto>=0?'var(--ok)':'#c00'}">${fmt(neto)}</b></div>
    </div>
    <div class="card"><div class="lbl">Datos del negocio</div>
      <div class="kv"><span>🧾 Ticket promedio</span><b>${fmt(ticket)}</b></div>
      <div class="kv"><span>📈 Contra ${prevTxt}</span><b style="color:${dif===null?'inherit':dif>=0?'var(--ok)':'#c00'}">${dif===null?'—':(dif>=0?'+':'')+dif+'%'}</b></div>
      <div class="kv"><span>⏰ Hora con más ventas</span><b>${hp?hp[0]+':00 a '+(+hp[0]+1)+':00':'—'}</b></div>
      ${per!=='hoy'?`<div class="kv"><span>⭐ Mejor día</span><b>${md?md[0].split('-').reverse().slice(0,2).join('/')+' · '+fmt(md[1]):'—'}</b></div>`:''}
    </div>
    ${S.barberos.length<2?'':S.barberos.map((bn,bi)=>{const pc=S.com[bi]||0;const bv=vs.filter(v=>v.barb===bn);const bt=bv.reduce((s,v)=>s+v.total,0);const sv={};bv.forEach(v=>v.items.forEach(i=>{sv[i.n]=(sv[i.n]||0)+i.q}));const bs=md=>bv.filter(v=>v.medio===md).reduce((s,v)=>s+v.total,0);return `<div class="card"><div class="lbl">🧑 ${bn}</div><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="big">${fmt(bt)}</div><div class="mut">${bv.length} ${bv.length===1?'cliente':'clientes'}</div></div>
      <div class="kv"><span>💵 Efectivo</span><b>${fmt(bs('ef'))}</b></div><div class="kv"><span>📲 Mercado Pago</span><b>${fmt(bs('tr'))}</b></div><div class="kv"><span>📒 Fiado</span><b class="debe">${fmt(bs('fi'))}</b></div>
      ${pc?`<div style="background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:10px"><div class="kv"><span>💈 Le toca a ${bn} (${pc}%)</span><b style="color:var(--ok)">${fmt(bt*pc/100)}</b></div><div class="kv"><span>🏠 Para el negocio (${100-pc}%)</span><b>${fmt(bt*(100-pc)/100)}</b></div></div>`:''}
      ${Object.keys(sv).length?`<div class="mut" style="margin-top:8px">${Object.entries(sv).sort((a,b)=>b[1]-a[1]).map(([n,q])=>q+'× '+n).join(' · ')}</div>`:''}</div>`}).join('')}
    ${per==='hoy'?`<div class="card"><div class="lbl">Tenés que tener en la caja</div><div class="big" style="color:var(--ok)">${fmt(enCaja)}</div>
      <div class="kv"><span>🔓 Apertura (cambio)</span><b>${fmt(ap)}</b></div><div class="kv"><span>+ Ventas en efectivo</span><b>${fmt(ef)}</b></div><div class="kv"><span>+ Cobros de fiado en efectivo</span><b>${fmt(cob.ef)}</b></div><div class="kv"><span>− Gastos y retiros en efectivo</span><b style="color:#c00">${fmt(gef)}</b></div>
      <div class="row" style="margin-top:10px"><button class="btn sec" onclick="apertura()">🔓 Apertura</button><button class="btn sec" onclick="nuevoGasto()">💸 Anotar gasto</button></div></div>`:
    `<div class="card"><div class="lbl">Por día</div>${Object.entries(dias).sort().map(([k,v])=>{const [y,mo,da]=k.split('-');return `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px"><span style="width:44px" class="mut">${da}/${mo}</span><div style="flex:1;height:12px;background:var(--bg);border-radius:6px;overflow:hidden"><div style="width:${v/dmax*100}%;height:100%;background:var(--a);border-radius:6px"></div></div><b style="width:84px;text-align:right">${fmt(v)}</b></div>`}).join('')||'<div class="empty">Sin ventas</div>'}</div>`}
    <div class="card list"><div class="lbl">Lo que más vendés</div>${tops.length?tops.map(([n,x],i)=>`<div class="li"><div><b>${i+1}. ${n}</b><div class="mut">${x.q} ${x.q===1?'vez':'veces'}</div></div><b>${fmt(x.m)}</b></div>`).join(''):'<div class="empty">Todavía no hay ventas</div>'}</div>
    <div class="card list"><div class="lbl">Gastos y retiros</div>${gs.length?gs.slice().reverse().map(g=>`<div class="li" onclick="borrarGasto('${g.id}')"><div><b style="color:#c00">−${fmt(g.m)}</b><div class="mut">${new Date(g.t).toLocaleDateString('es-AR',{day:'numeric',month:'numeric'})} · ${g.det||'Gasto'}</div></div><div class="mut">${g.medio==='tr'?'M. Pago':'Efectivo'} 🗑</div></div>`).join(''):'<div class="empty">Sin gastos</div>'}${per!=='hoy'?'<button class="btn sec" style="margin-top:10px" onclick="nuevoGasto()">💸 Anotar gasto</button>':''}</div>
    <div class="card list"><div class="lbl">${per==='hoy'?'Ventas de hoy':'Ventas'} · tocá una para corregirla</div>${vs.length?vs.slice().reverse().slice(0,60).map(v=>`<div class="li" onclick="editVenta('${v.id}')"><div><b>${fmt(v.total)}</b><div class="mut">${per==='hoy'?'':new Date(v.t).toLocaleDateString('es-AR',{day:'numeric',month:'numeric'})+' '}${new Date(v.t).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}${v.cli?' · 👤 '+v.cli:''}${v.barb?' · 🧑 '+v.barb:''} · ${v.items.map(i=>i.q+'× '+i.n).join(', ')}</div></div><div class="mut">${{ef:'Efectivo',tr:'M. Pago',fi:'Fiado'}[v.medio]} ✎</div></div>`).join(''):'<div class="empty">Sin ventas</div>'}</div>
    <button class="btn sec" onclick="compartirCierre()">${per==='hoy'?'Mandar cierre por WhatsApp':'Mandar balance por WhatsApp'}</button>`;
  }
  if(view==='prods'){
    m.innerHTML=`<div class="row" style="margin-bottom:12px"><button class="btn" onclick="editProd()">+ Agregar</button><button class="btn ok" onclick="subirPrecios()">📈 Subir %</button></div>
    <div class="card list">${S.prods.map(p=>`<div class="li" onclick="editProd('${p.id}')"><b>${p.n}</b><span>${fmt(p.p)}</span></div>`).join('')}</div>
    <div class="card"><div class="lbl">Negocio</div><b style="font-size:18px">${S.nombre||''}</b><div class="mut" style="margin:6px 0 12px">${estadoLic()==='ok'?'✅ Activa hasta fin de '+mesTxt(S.lic):estadoLic()==='gracia'?'⚠️ Venció '+mesTxt(S.lic)+'. Tenés hasta el 10 para renovar':'⏸️ Pausada'}</div><button class="btn sec" onclick="pedirCodigo()">🔑 Poner código del mes</button></div>

    <div class="card"><div class="lbl">Empleados (opcional)</div><div class="mut" style="margin-bottom:10px">Si atienden varios, cargalos y al cobrar elegís quién fue. El % es la comisión (0 = dueño).</div>${S.barberos.map((b,i)=>`<div class="row"><input class="f" style="flex:2" value="${b}" onchange="if(this.value.trim()){S.barberos[${i}]=this.value.trim();save();toast('Guardado ✓')}"><input class="f" style="flex:1" type="number" inputmode="numeric" value="${S.com[i]||0}" onchange="S.com[${i}]=Math.max(0,Math.min(100,+this.value||0));save();toast('Comisión guardada ✓')"><button class="btn sec" style="width:52px;flex:none;margin-bottom:10px" onclick="if(confirm('¿Sacar a ${b}?')){S.barberos.splice(${i},1);S.com.splice(${i},1);save();render()}">✕</button></div>`).join('')}<button class="btn sec" onclick="const n=prompt('Nombre del empleado');if(n&&n.trim()){S.barberos.push(n.trim());S.com.push(0);save();render()}">+ Agregar empleado</button></div>
    <button class="btn sec" style="margin-bottom:12px" onclick="cambiarClave()">🔒 Cambiar clave</button>
    <div class="mut" style="text-align:center;margin:-4px 0 12px">Versión 3 · 4712web</div>

const LSEC='d604914749aff4575c7c04ee';
const normN=n=>(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
async function codigo(n,ym){const b=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('4712k:'+LSEC+':'+normN(n)+':'+ym)));return String(((b[0]<<24)>>>0)+(b[1]<<16)+(b[2]<<8)+b[3]).slice(-6).padStart(6,'0')}
const ymOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const ymAdd=(ym,k)=>{const [y,m]=ym.split('-').map(Number);return ymOf(new Date(y,m-1+k,1))};
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mesTxt=ym=>MESES[+ym.split('-')[1]-1];

async function activar(code,nombre){code=(code||'').replace(/\D/g,'');const cur=ymOf(new Date());let best=null;for(const k of [-1,0,1,2]){const ym=ymAdd(cur,k);if(await codigo(nombre||S.nombre,ym)===code)best=ym}return best}

function rango(k){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate(),lun=d-((n.getDay()+6)%7);const f=x=>x.toLocaleDateString('es-AR',{day:'numeric',month:'numeric'});
  if(k==='hoy')return[new Date(y,m,d).getTime(),Infinity,'Vendido hoy'];

  if(k==='ant')return[new Date(y,m,lun-7).getTime(),new Date(y,m,lun).getTime(),'Semana pasada ('+f(new Date(y,m,lun-7))+' al '+f(new Date(y,m,lun-1))+')'];

function compartirCierre(){const [ini,fin,tit]=rango(per);const vs=S.ventas.filter(v=>v.t>=ini&&v.t<fin);const sm=(a,md)=>a.filter(v=>!md||v.medio===md).reduce((s,v)=>s+v.total,0);

  const pb=S.barberos.length<2?'':S.barberos.map((b,bi)=>{const pc=S.com[bi]||0;const x=vs.filter(v=>v.barb===b),t=sm(x);return `\n🧑 ${b}: ${fmt(t)} (${x.length} ${x.length===1?'cliente':'clientes'})\n   Efectivo ${fmt(sm(x,'ef'))} · M. Pago ${fmt(sm(x,'tr'))} · Fiado ${fmt(sm(x,'fi'))}${pc?`\n   Le toca (${pc}%): ${fmt(t*pc/100)}\n   Para el negocio: ${fmt(t*(100-pc)/100)}`:''}`}).join('');
  let dias='';if(per!=='hoy'){const dd={};vs.forEach(v=>{const k=dk(v.t);dd[k]=(dd[k]||0)+v.total});dias='\n\nPor día:'+Object.keys(dd).sort().map(k=>{const [y,mo,da]=k.split('-');return `\n${da}/${mo}: ${fmt(dd[k])}`}).join('')}
  wa((`${per==='hoy'?'Cierre':'Balance'} ${S.nombre||''} · ${per==='hoy'?new Date().toLocaleDateString('es-AR'):tit}\nClientes: ${vs.length}\nEfectivo: ${fmt(sm(vs,'ef'))}\nMercado Pago: ${fmt(sm(vs,'tr'))}\nFiado: ${fmt(sm(vs,'fi'))}\nCobros de fiado: ${fmt(cob)}\nTOTAL VENDIDO: ${fmt(sm(vs))}\nGastos y retiros: -${fmt(gt)}${gs.length?gs.map(g=>`\n   · ${g.det||'Gasto'}: ${fmt(g.m)}`).join(''):''}\nNETO: ${fmt(sm(vs,'ef')+sm(vs,'tr')+cob-gt)}${per==='hoy'?`\n\nEn la caja tiene que haber: ${fmt(apx+sm(vs,'ef')+cobE-gE)}`:''}\n${pb}${dias}`))}

function aplicarPc(){const pc=+$('#pc').value;if(!(pc>0))return;S.prods.forEach(x=>x.p=nuevoP(x.p,pc));save();cerrar();render();toast('Precios +'+pc+'% ✓')}
async function respaldar(){
  const name='caja-copia-'+new Date().toLocaleDateString('es-AR').replaceAll('/','-')+'.json';
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Copia de la caja',text:'Copia de seguridad de la caja'});S.ultResp=Date.now();save();render();toast('Copia guardada ✓');return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();S.ultResp=Date.now();save();render();toast('Copia descargada ✓');
}
function recuperar(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.prods||!x.ventas||!x.clientes)throw 0;if(confirm('¿Reemplazar los datos de este celu por la copia?')){S=x;save();render();toast('Copia recuperada ✓')}}catch(e){toast('Ese archivo no es una copia válida')}};r.readAsText(f)}
let dp=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!standalone){if(isIOS){$('#inst').classList.remove('hide');$('#brand').classList.add('hide')}}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').classList.remove('hide');$('#brand').classList.add('hide')});
addEventListener('appinstalled',()=>{$('#inst').classList.add('hide');$('#brand').classList.remove('hide');toast('App instalada ✓')});
function instalar(){if(dp){dp.prompt();dp=null;return}abrir(`<h3>Instalar en iPhone</h3><div class="kv"><span>1. Tocá el botón Compartir</span><b>⬆️</b></div><div class="kv"><span>2. "Agregar a pantalla de inicio"</span><b>➕</b></div><div class="kv"><span>3. Tocá "Agregar"</span><b>✓</b></div><button class="btn" style="margin-top:14px" onclick="cerrar()">Listo</button>`)}
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}})}
ponerNombre();window.trasLock=()=>{if(!S.nombre)bienvenida();else chequearLic()};render();

<div id="lock" style="position:fixed;inset:0;z-index:50;background:#0A0B10;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px">
  <img src="icon-192.png" style="width:84px;height:84px;border-radius:50%">
  <div id="lkT" style="font:700 20px system-ui">Ingresá tu clave</div>
  <div id="lkD" style="display:flex;gap:14px"></div>
  <div id="lkE" style="color:#ff6b6b;height:18px;font-size:14px"></div>
  <div style="display:grid;grid-template-columns:repeat(3,76px);gap:14px"></div>
</div>
<style>.kp{width:76px;height:76px;border-radius:50%;border:0;background:#1d1f27;color:#fff;font:600 28px system-ui}.kp:active{background:var(--a)}.dot{width:16px;height:16px;border-radius:50%;border:2px solid #fff}.dot.f{background:var(--a);border-color:var(--a)}</style>
<script>
(function(){
  const LK='caja4712-pin';let pin='',paso,primera='';
  const get=()=>{try{return localStorage.getItem(LK)}catch(e){return null}};
  const set=v=>{try{localStorage.setItem(LK,v)}catch(e){}};
  async function h(x){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('c4712:'+x));return [...new Uint8Array(b)].map(z=>z.toString(16).padStart(2,'0')).join('')}
  const L=document.getElementById('lock'),T=document.getElementById('lkT'),D=document.getElementById('lkD'),E=document.getElementById('lkE');
  L.lastElementChild.innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button class="kp" data-k="${k}">${k}</button>`).join('');
  const dots=()=>D.innerHTML=[0,1,2,3].map(i=>`<div class="dot ${i<pin.length?'f':''}"></div>`).join('');
  function mostrar(){pin='';E.textContent='';paso=get()?'entrar':'crear';T.textContent=paso==='entrar'?'Ingresá tu clave':'Creá tu clave de 4 números';L.style.display='flex';dots()}
  window.bloquear=mostrar;
  L.addEventListener('click',async e=>{const k=e.target.dataset&&e.target.dataset.k;if(k===undefined)return;
    if(k==='⌫'){pin=pin.slice(0,-1);dots();return}
    if(pin.length>=4)return;pin+=k;dots();if(pin.length<4)return;
    await new Promise(r=>setTimeout(r,120));
    if(paso==='entrar'||paso==='entrar2'){if(await h(pin)===get()){if(paso==='entrar2'){paso='cambiar';T.textContent='Nueva clave de 4 números';pin='';dots()}else{L.style.display='none';window.trasLock&&trasLock()}}else{E.textContent='Clave incorrecta';if(navigator.vibrate)navigator.vibrate(200);pin='';dots()}}
    else if(paso==='crear'||paso==='cambiar'){primera=pin;paso='confirmar';pin='';T.textContent='Repetí la clave';dots()}
    else if(paso==='confirmar'){if(pin===primera){set(await h(pin));L.style.display='none';window.trasLock&&trasLock();if(window.toast)toast('Clave guardada ✓')}else{E.textContent='No coinciden, probá de nuevo';paso=get()?'cambiar':'crear';T.textContent='Creá tu clave de 4 números';pin='';dots()}}
  });
  window.cambiarClave=()=>{mostrar();paso='entrar2';T.textContent='Ingresá tu clave actual'};
  let oculto=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)oculto=Date.now();else if(oculto&&Date.now()-oculto>5*60e3)mostrar()});
  mostrar();
})();
</script>
