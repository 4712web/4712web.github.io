<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Revisión</title>
<style>body{margin:0;background:#111;color:#eee;font:15px/1.45 system-ui,sans-serif;padding:16px}h1{font-size:18px;margin:0 0 12px}.ok{color:#5d5}.bad{color:#f77}.c{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:12px;margin:10px 0;word-break:break-word}small{color:#999}</style></head><body>
<h1>Revisión de cambios · <span id="k"></span></h1><div id="out">Revisando…</div>
<script>
const K = new URLSearchParams(location.search).get("k") || "cherrymood";
document.getElementById("k").textContent = K;
const SHEET = "1W7bLBLQev6xfisgqklAOX-M-bwlv_es_RpVmePuaLCY", GID = "245098590";
const u64 = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const out = document.getElementById("out"); const L = []; const add = (h, cls="") => { L.push(`<div class="c ${cls}">${h}</div>`); out.innerHTML = L.join(""); };
function q(tq){ return new Promise(res => { const cb = "__d" + Math.random().toString(36).slice(2), s = document.createElement("script");
  window[cb] = r => { delete window[cb]; s.remove(); res(r); }; s.onerror = () => res({status:"neterror"});
  s.src = `https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?gid=${GID}&tq=${encodeURIComponent(tq)}&tqx=out:json;responseHandler:${cb}&_=${Date.now()}`; document.head.appendChild(s); }); }
const cellDate = c => c && c.f ? c.f : (c && c.v) || "";
(async () => {
  out.innerHTML = "";
  const r1 = await q(`select A, B where B starts with 'CAMBIO[${K}]' order by A desc limit 5`);
  if (r1.status !== "ok"){ add("No pude leer la planilla de cambios: " + (r1.status||"") + " " + JSON.stringify(r1.errors||""), "bad"); }
  const rows = r1.table?.rows || [];
  add(`Cambios publicados encontrados: <b>${rows.length}</b>`, rows.length ? "ok" : "bad");
  let last = null;
  for (const r of rows){ const v = r.c?.[1]?.v || ""; const m = v.match(/^CAMBIO\[[^\]]+\] (\{[\s\S]*\}) FIRMA ([A-Za-z0-9_-]+)\s*$/);
    let j = null; try { j = m && JSON.parse(m[1]); } catch {}
    if (!last && j) last = j;
    add(`<small>${cellDate(r.c?.[0])}</small><br>largo ${v.length} · ${m ? "formato OK" : "<span class=bad>formato roto</span>"} · ${j ? `${(j.p||[]).length} productos, ${(j.n||[]).length} nuevos, ${(j.p||[]).filter(x=>x.sin).length} sin stock, ${(j.p||[]).filter(x=>Array.isArray(x.f)).length} con fotos cambiadas` : ""}`); }
  if (!last) return;
  const hs = [...new Set([...(last.p||[]), ...(last.n||[])].flatMap(x => Array.isArray(x.f) ? x.f : []).filter(r => !r.startsWith("b:")))];
  add(`Fotos nuevas que pide el último cambio: <b>${hs.length}</b><br><small>${hs.join(" ")}</small>`);
  const r2 = await q(`select A, B, C where B starts with 'FOTO[${K}]' order by A desc limit 60`);
  if (r2.status !== "ok") add("No pude leer las fotos: " + (r2.status||"") + " " + JSON.stringify(r2.errors||""), "bad");
  const fr = r2.table?.rows || []; add(`Filas de FOTO en la planilla: <b>${fr.length}</b>`, fr.length ? "ok" : "bad");
  for (const r of fr.slice(0, 20)){ const v = r.c?.[1]?.v || ""; const rest = v.slice(`FOTO[${K}] `.length), sp = rest.indexOf(" "), h = rest.slice(0, sp), d = rest.slice(sp+1).trim();
    let hh = ""; try { hh = u64(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(d))).slice(0,16); } catch {}
    add(`<small>${cellDate(r.c?.[0])}</small><br>huella ${h} · largo total ${v.length} · empieza bien: ${/^data:image\//.test(d) ? "sí" : "<span class=bad>no</span>"} · termina: …${esc(v.slice(-12))} · verificación: ${hh === h ? "<span class=ok>OK</span>" : "<span class=bad>NO coincide ("+hh+")</span>"} · ${hs.includes(h) ? "la usa el último cambio" : "no usada"}${d.length < 200000 && /^data:image/.test(d) ? `<br><img src="${d}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;margin-top:6px">` : ""}`); }
  const falt = hs.filter(h => !fr.some(r => (r.c?.[1]?.v||"").startsWith(`FOTO[${K}] ${h} `)));
  add(falt.length ? `Fotos que NO llegaron a la planilla: <b>${falt.length}</b>` : "Todas las fotos del último cambio están en la planilla", falt.length ? "bad" : "ok");
})();
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
</script></body></html>
